name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify before release
        run: npm run check

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(node scripts/extract-changelog.mjs "${{ github.ref_name }}")
          gh release create "${{ github.ref_name }}" \
            --title "MapScan DSH ${{ github.ref_name }}" \
            --notes "$NOTES" \
            --verify-tag
