name: Bug 报告
description: 报告插件缺陷或异常行为
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈 Bug。请尽量提供完整信息, 便于复现与修复。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 插件/仓库版本 (如 v1.0.0, 或 commit hash)
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      multiple: true
      options:
        - fofa
        - shodan
        - hunter
        - zoomeye
        - quake
        - 不涉及 (其他)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 描述触发问题的操作 (工具名 + 参数示例)
      placeholder: |
        1. map_search { platform: 'fofa', query: '...' }
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 错误信息 / 返回内容 (请勿粘贴 API Key 等敏感信息)
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      description: DSH 版本、操作系统、Node 版本等
      placeholder: |
        - OS: Windows 11
        - Node: v20.x
        - DSH: ...
    validations:
      required: false
