# MapScan DSH — bundle 层补丁
#
# 作用: 把本插件作为一行挂载进装配树, 使 `dsh plugin` / 插件市场 / 设置页插件清单
# 能够把它识别为一个 bundle 并在重启后激活。
#
# 为什么必须有这个文件: DSH 的插件清单只把「声明了 `dsh.bundle.patch` 的包」当作插件层
# (见 @deepseek-ai/dsh-package-manifest 的 DshManifest/DshBundleManifest)。
# 只往 profile 的 cordis.patch.yml 手写 `insert:` 行虽然也能加载, 但插件清单读不到,
# 表现就是「装了但检测不到该插件」。
#
# 补丁语义提醒: loader 的 config 是**整块替换、绝不深合并**, 所以这里只做 insert,
# 不覆写任何既有条目的 config, 避免误删 base 层的配置。
#
# `config` 即插件 Config 的当前值, 由设置页的自动生成表单读写 (经 settings 服务落回本行)。
# 值会以**明文**保存在 profile 配置里; 若不想让 Key 落盘, 留空并改用凭证库 (map_set_keys)
# 或环境变量。
#
# ⚠ 这里只放**空字符串**占位, 不写具体默认值: 补丁层的值会盖住 profile 里保存的表单值,
# 写死 `timeoutSec: 30` 会让用户改过的超时永远回到 30。真正的默认值由 Config 的
# `.default(30)` 提供 (仅在未配置时生效)。
- insert:
    - id: mapscan-dsh
      name: 'mapscan-dsh'
      config:
        fofa: '' # FOFA API Key (fofa.info 个人中心)
        shodan: '' # Shodan API Key (account.shodan.io)
        hunter: '' # 鹰图 Hunter API Key (hunter.qianxin.com 个人中心)
        zoomeye: '' # ZoomEye API-KEY (zoomeye.org/profile)
        quake: '' # Quake Token (quake.360.net 个人中心)
        timeoutSec: '' # 单请求超时(秒), 留空用默认 30
